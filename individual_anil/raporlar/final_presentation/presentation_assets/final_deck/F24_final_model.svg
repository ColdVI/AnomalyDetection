   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="51.84" y="93.437813" transform="rotate(-0 51.84 93.437813)">Ortak protokol — dört veri setinde birebir aynı kurulum</text>
   </g>
   <g id="text_3">
