   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1baf7a" x="1046.88" y="233.456836" transform="rotate(-0 1046.88 233.456836)">event</text>
