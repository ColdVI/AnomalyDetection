   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2a78d6" x="853.2" y="164.16" transform="rotate(-0 853.2 164.16)">karar</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1baf7a" x="64.8" y="349.2" transform="rotate(-0 64.8 349.2)">Neden reconstruction değil forecasting?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(64.8 387.382422)">Bir autoencoder girdiyi yeniden kurmaya çalışır ve büyük değerleri yeniden kurmak doğal olarak zordur — bu yüzden skor</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(64.8 406.132422)">büyüklüğü takip eder. Forecasting farklı bir soru sorar: 'bir sonraki adım ne olmalı'. Değerler büyük olsa bile komuta uygun</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(64.8 424.882422)">tepki varsa tahmin hatası küçük kalır. Bu, bir önceki slayttaki genlik problemine doğrudan cevaptır.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2a78d6" x="80.64" y="482.679141" transform="rotate(-0 80.64 482.679141)">Ön işleme</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(80.64 519.31125)">yalnız training verisinden robust ölçekleme</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(80.64 536.11125)">(median, 1,4826×MAD), [−5, +5] clip</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #eb6834" x="437.04" y="480.417891" transform="rotate(-0 437.04 480.417891)">Pencere kuralı</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(437.04 519.31125)">5 saniyeden uzun boşlukta ve uçuş</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(437.04 536.11125)">sınırında pencere kesilir</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4a3aa7" x="793.44" y="480.417891" transform="rotate(-0 793.44 480.417891)">Aktif kanal</text>
   </g>
