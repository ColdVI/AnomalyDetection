   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="51.84" y="93.792188" transform="rotate(-0 51.84 93.792188)">LSTM autoencoder — mimari hiç değişmedi, yalnız normal uçuş havuzu büyüdü</text>
   </g>
   <g id="text_3">
