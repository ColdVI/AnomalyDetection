   </g>
   <g id="text_5">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(82.08 308.441328)">Neden: Akraba uçuşlar rollere dağılırsa</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(82.08 323.966328)">model testi zaten eğitimde görür.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #eb6834" x="613.44" y="177.077344" transform="rotate(-0 613.44 177.077344)">Causal scoring</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(613.44 214.287187)">t anındaki skor yalnız x ≤ t</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(613.44 233.746562)">kullanılarak üretilir.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(614.88 308.38293)">Neden: Uçuşun tamamından normalize etmek</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(614.88 323.966328)">geleceğe bakma hatasıdır.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4a3aa7" x="80.64" y="414.677344" transform="rotate(-0 80.64 414.677344)">Frozen policy</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(80.64 452.883516)">Ölçekleme, checkpoint ve threshold</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(80.64 470.087188)">yalnız validation'da seçilir.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(82.08 545.895781)">Neden: Test sonucuna bakıp eşik oynatmak</text>
